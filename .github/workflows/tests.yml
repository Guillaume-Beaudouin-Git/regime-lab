name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --extra dev
      - run: uv run ruff check regime_lab scripts tests
        continue-on-error: true
      - run: uv run pytest -q -p no:cacheprovider
