[project]
name = "regime-lab"
version = "0.1.0"
description = "Market regime detection under a point-in-time data contract, and conditional allocation"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "python-dotenv>=1.0",
    # Modelling. Absent from the first version of this list, which meant the
    # documented setup command installed none of the three model families, nor
    # the libraries behind every t-statistic and every detectable-effect figure.
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "hmmlearn>=0.3",
    "lightgbm>=4.0",
    "jumpmodels>=0.1",
    # scripts/replicate_shu2024.py reads Shiller's ie_data.xls over HTTP with
    # pandas.read_excel, which needs an .xls engine. It was installed by hand and
    # absent from this list, so a fresh clone failed with an ImportError that the
    # tests could not see because main() is never called by them.
    "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["regime_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# run_barrier.py prints the propfirm geometry it was given, parameter by
# parameter, inside triple-quoted blocks. Those lines are output text, not code:
# rewrapping them changes the printed table and breaks the reproduction check
# that makes the script worth keeping. Narrowed to this one rule, this one file.
"scripts/run_barrier.py" = ["E501"]
# Same reason: run_m3_evaluation.py prints wide result tables, and rewrapping the
# f-strings that build them changes the printed output rather than the code.
"scripts/run_m3_evaluation.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
