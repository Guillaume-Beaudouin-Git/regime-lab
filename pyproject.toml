[project]
name = "regime-lab"
version = "0.1.0"
description = "Market regime detection under a point-in-time data contract, and conditional allocation"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "python-dotenv>=1.0",
    # Modelling. Absent from the first version of this list, which meant the
    # documented setup command installed none of the three model families, nor
    # the libraries behind every t-statistic and every detectable-effect figure.
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "hmmlearn>=0.3",
    "lightgbm>=4.0",
    "jumpmodels>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["regime_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
