[project]
name = "reversal-lab"
version = "0.1.0"
description = "Short-term reversal in individual equities: how much of it is a premium, and how much is a spread"
requires-python = ">=3.12"
dependencies = [
    # This project imports regime_lab for the point-in-time contract, the
    # coverage guard, the stationary block bootstrap and the trial register.
    # Resolved from the workspace root since the repositories were merged.
    "regime-lab",
    "pandas>=2.2", "numpy>=1.26", "pyarrow>=16", "requests>=2.31",
    "yfinance>=0.2.40", "python-dotenv>=1.0", "scipy>=1.13",
    "statsmodels>=0.14", "scikit-learn>=1.5",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["reversal_lab"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
regime-lab = { workspace = true }
